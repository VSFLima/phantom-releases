name: Build distro release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-distro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and upload phantom.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x distro/build-distro.sh
          ./distro/build-distro.sh "$GITHUB_REPOSITORY" "distro-phantom"
